[project]
name = "hornet"
version = "0.1.0"
description = "Hornet — macro/country risk dashboard and LLM-powered analyst assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "structlog>=24.4",
    "typer>=0.13",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "yfinance>=0.2",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ipython>=8.29",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hornet"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear — catches common bugs
    "UP",   # pyupgrade — modernizes syntax
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles it
]
# TCH (type-checking-imports) is intentionally NOT selected:
# Pydantic models and runtime-checkable Protocols need their annotation
# types available at runtime for model construction and isinstance checks.
# TCH would force us to either break Pydantic or sprinkle noqa everywhere.

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

# Third-party libraries without type stubs or py.typed markers.
# Each entry documents an upstream gap, not a local suppression.
[[tool.mypy.overrides]]
module = "yfinance"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
