  - question_id: "rationale_confidence_check"
    template_name: "alert_rationale"
    country_iso3: "NGA"
    reference_date: "2026-04-01"
    description: "Verify output contains valid confidence_level field"
    required_indicators: []
    min_citations: 3
    max_ungrounded: 3
    forbidden_patterns:
      - '"confidence_level"\\s*:\\s*"(?!high|medium|low)'
