# Source indicator registry for Hornet.
#
# Every (source_id, source_native_code) -> canonical indicator_code
# mapping lives here. Phase 3 adds dimension, concept, and global_signal
# fields to support the scoring engine.
#
# Fields:
#   source_id           'fred', 'worldbank', etc. Matches adapter.source_id.
#   source_native_code  The source's own identifier for the series.
#   indicator_code      Canonical Hornet code (e.g. CPI_YOY, GDP_GROWTH).
#   frequency           daily / weekly / monthly / quarterly / annual / forecast
#   countries_iso3      List of ISO3 codes this series covers.
#   name                Optional human-readable label.
#   unit                Optional unit of measure.
#   dimension           Scoring dimension: growth_momentum / external_balance /
#                       monetary_stance / risk_sentiment. Null for non-scored.
#   concept             Deduplication concept within a dimension (e.g. 'gdp',
#                       'cpi'). Null for non-scored.
#   global_signal       true for indicators that apply to ALL countries
#                       (e.g. US Treasury yields). Stored with origin country.
#   enabled             Optional soft-disable flag. Defaults to true.
#   notes               Optional operator notes.

