[alembic]
# Path to the migrations directory (relative to cwd when invoking alembic).
script_location = migrations

# Ensure `import hornet` resolves when env.py runs.
prepend_sys_path = .

# Always record create_date in UTC — avoids "what timezone was this?" ambiguity.
timezone = UTC

# sqlalchemy.url is intentionally left blank here. `alembic/env.py`
# overrides it from `Settings.db_url` at runtime so there is exactly
# one source of truth for the database URL.
sqlalchemy.url =

[post_write_hooks]
# After generating a new migration file (via `alembic revision`),
# auto-format it with ruff so it matches the rest of the codebase.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
