services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ridge-postgres
    environment:
      POSTGRES_USER: ridge
      POSTGRES_PASSWORD: ridge
      POSTGRES_DB: ridge
    ports:
      - "5432:5432"
    volumes:
      - ridge-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridge -d ridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ridge-pgdata:
