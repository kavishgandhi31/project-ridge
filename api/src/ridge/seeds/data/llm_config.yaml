# LLM layer configuration -- loaded by seed loader into LLMConfig.
#
# Provider-specific settings control model selection, timeouts, and
# context windows. Routing maps task types to providers. Cost guard
# sets daily token budgets to prevent runaway API spend.
#
# API keys are NOT in this file -- they come from environment
# variables via Settings (RIDGE_ANTHROPIC_API_KEY, etc.).

ollama:
  base_url: "http://100.74.213.63:11434"
  model: "qwen3:14b-q4_K_M"
  max_context_tokens: 32768
  timeout_seconds: 300
  max_tokens: 4000

claude:
  model: "claude-sonnet-4-20250514"
  max_context_tokens: 200000
  timeout_seconds: 60
  max_tokens: 4000

# OpenAI-compatible provider is optional. Uncomment and configure
# if you want to use vLLM, LM Studio, llama.cpp, etc.
# openai_compat:
#   base_url: "http://localhost:8080/v1"
#   model: "your-model-name"
#   max_context_tokens: 32768
#   timeout_seconds: 300
#   max_tokens: 4000
#   api_key: null

routing:
  country_narrative: "ollama"     # batch, runs nightly, zero cost
  alert_rationale: "claude"       # ESCALATE only, needs real reasoning
  interactive_query: "ollama"     # local for now, switch to claude for paid tier
  classification: "ollama"        # tagging, local
  fallback: "claude"              # if primary provider is unhealthy

cost_guard:
  ollama_daily_tokens: 0          # 0 = unlimited (local, zero cost)
  claude_daily_tokens: 500000     # ~$1.50/day at Sonnet pricing
  openai_compat_daily_tokens: 0   # 0 = unlimited

# Grounding quality thresholds
min_grounding_score: 0.8          # responses below this are flagged
context_token_reserve: 1000       # reserved for system prompt + output overhead
