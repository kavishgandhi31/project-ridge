# Alert configuration -- tier thresholds and escalation modifiers.
#
# Thresholds are applied to abs(composite). Both positive (improving)
# and negative (deteriorating) composites are evaluated the same way.
#
# v1 defaults preserved exactly:
#   WATCH >= 1.0, ALERT >= 1.5, ESCALATE >= 2.0
#   streak_required: 2, velocity_threshold: 0.5
#   min_coverage_for_escalate: 0.5, max_daily_escalations: 10

alert_config:
  # Tier thresholds (applied to abs(composite))
  watch_threshold: 0.1
  alert_threshold: 0.3
  escalate_threshold: 0.6

  # Coverage gate: countries with coverage below this fraction
  # cap at ALERT (prevents spending Claude API on thin data)
  min_coverage_for_escalate: 0.5

  # Streak requirement: consecutive prior ALERT+ runs needed
  # before ESCALATE is allowed (prevents single-run spikes)
  streak_required: 0

  # Velocity boost: minimum |delta(composite)| between runs to
  # trigger a one-level promotion (only for deteriorating countries)
  velocity_threshold: 0.5

  # Dispatch limit: max countries at ESCALATE per run
  # (cost control for Claude API deep analysis)
  max_daily_escalations: 10
