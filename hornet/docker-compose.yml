services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hornet-postgres
    environment:
      POSTGRES_USER: hornet
      POSTGRES_PASSWORD: hornet
      POSTGRES_DB: hornet
    ports:
      - "5432:5432"
    volumes:
      - hornet-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hornet -d hornet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hornet-pgdata:
